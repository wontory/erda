openapi: 3.0.3
info:
  title: 메이플스토리 API
  version: 1.0.0
  contact:
    name: help_openapi@nexon.co.kr
  description: |-
    - 메이플스토리 게임 데이터는 평균 15분 후 확인 가능합니다.
    - 게임 콘텐츠 변경으로 ocid가 변경될 수 있습니다. ocid 기반 서비스 갱신 시 유의해 주시길 바랍니다.
    - 해당 API는 메이플스토리 한국의 데이터가 제공됩니다.

servers:
  - url: 'https://open.api.nexon.com'

tags:
  - name: BattlePractice
    description: 연무장 정보 조회

paths:
  /maplestory/v1/battle-practice/replay-id:
    get:
      tags:
      - BattlePractice
      summary: 연무장 리플레이 식별자 조회
      description: |-
        캐릭터의 연무장 리플레이 식별자를 조회합니다.
        리플레이를 등록한 캐릭터에 대해서만 조회가 가능합니다.
      parameters:
      - name: x-nxopen-api-key
        in: header
        description: API KEY
        required: true
        schema:
          type: string
      - name: ocid
        in: query
        description: 캐릭터 식별자
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayId'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage' 
      
  /maplestory/v1/battle-practice/result:
    get:
      tags:
      - BattlePractice
      summary: 연무장 측정 결과 정보 조회
      description: 연무장 측정 결과 정보를 조회합니다.
      parameters:
      - name: x-nxopen-api-key
        in: header
        description: API KEY
        required: true
        schema:
          type: string
      - name: replay_id
        in: query
        description: 연무장 리플레이 고유 식별자
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattlePracticeResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /maplestory/v1/battle-practice/skill-timeline:
    get:
      tags:
      - BattlePractice
      summary: 연무장 스킬 사용 내역 조회
      description: 연무장 진행 간 스킬 사용 내역을 조회합니다.
      parameters:
      - name: x-nxopen-api-key
        in: header
        description: API KEY
        required: true
        schema:
          type: string
      - name: replay_id
        in: query
        description: 연무장 리플레이 고유 식별자
        required: true
        schema:
          type: string
      - name: page_no
        in: query
        description: 페이지 번호 (미입력 시 1페이지 조회)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillTimeline'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /maplestory/v1/battle-practice/character-info:
    get:
      tags:
      - BattlePractice
      summary: 연무장 입장 시 캐릭터 능력치 관련 정보 조회
      description: 연무장 입장 시의 캐릭터 능력치 관련 정보를 조회합니다.
      parameters:
      - name: x-nxopen-api-key
        in: header
        description: API KEY
        required: true
        schema:
          type: string
      - name: replay_id
        in: query
        description: 연무장 리플레이 고유 식별자
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattlePracticeCharacterInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'


components:
  schemas:
    ReplayId:
      type: object
      properties:       
        replay_list:
          type: array
          description: 리플레이 목록
          items:
            type: object
            properties:
              period_no:
                type: integer
                format: int64
                description: 기간 번호 (연무장 초기화 시마다 1씩 증가됩니다.)
              register_date:
                type: string
                description: 리플레이 등록 일시 (KST, 일 단위 데이터로 시, 분은 일괄 0으로 표기)
              replay_id:
                type: string
                description: 연무장 리플레이 고유 식별자
    BattlePracticeResult:
      type: object
      properties:
        register_date:
          type: string
          description: 리플레이 등록 일시 (KST, 일 단위 데이터로 시, 분은 일괄 0으로 표기)
        total_play_time:
          type: integer
          format: int64
          description: 총 연무 시간 (ms)
        total_damage:
          type: integer
          format: int64
          description: 총합 데미지
        total_dps:
          type: integer
          format: int64
          description: 초당 평균 데미지
        end_type:
          type: string
          description: 종료 타입 (1:자동 종료, 2:수동 종료, 3:시간 초과, 9:기타 종료)
        like_count:
          type: integer
          format: int64
          description: 리플레이 추천 수
        skill_statistic:
          type: array
          description: 스킬 단위 전투 분석 정보
          items:
            type: object
            properties:
              skill_name:
                type: string
                description: 스킬 명
              damage:
                type: integer
                format: int64
                description: 누적 데미지
              damage_percent:
                type: string
                description: 데미지 점유율
              dps:
                type: integer
                format: int64
                description: 초당 평균 데미지
              use_count:
                type: integer
                format: int64
                description: 사용 횟수
              damage_per_use:
                type: integer
                format: int64
                description: 1회당 평균 데미지
              attack_count:
                type: integer
                format: int64
                description: 공격 횟수
              max_damage:
                type: integer
                format: int64
                description: 최대 데미지(1타)
              min_damage:
                type: integer
                format: int64
                description: 최소 데미지(1타)

    SkillTimeline:
      type: object
      properties:
        page_no:
          type: integer
          format: int64
          description: 조회된 페이지 번호
        total_page_no:
          type: integer
          format: int64
          description: 전체 페이지 번호
        skill_timeline:
          type: array
          description: 스킬 타임라인 정보
          items:
            type: object
            properties:
              elapse_time:
                type: integer
                format: int64
                description: 연무 시작 후 경과 시간 (ms)
              skill_name:
                type: string
                description: 사용 스킬 명
              hexa_skill_specificity_flag:
                type: string
                description: 헥사 스킬 특성 여부 (0:그 외 스킬, 1:오리진 스킬, 2:어센트 스킬)
              sequence_name:
                type: string
                description: 시퀀스 명
              sequence_key:
                type: string
                description: 시퀀스 키



    BattlePracticeCharacterInfo:
      type: object
      properties:
        basic_object:
          type: object
          description: 기본 정보
          properties:
            character_name:
              type: string
              description: 캐릭터 명
            character_level:
              type: integer
              format: int64
              description: 캐릭터 레벨
            character_class:
              type: string
              description: 캐릭터 직업
            character_class_level:
              type: string
              description: 캐릭터 전직 차수
            character_image:
              type: string
              description: 캐릭터 이미지 URL
        stat_object:
          type: object
          description: 스탯 관련 정보
          properties:
            basic_stat_object:
              type: object
              description: 스탯 정보
              properties:
                final_stat:
                  type: array
                  description: 현재 스탯 정보
                  items:
                    type: object
                    properties:
                      stat_name:
                        type: string
                        description: 스탯 명
                      stat_value:
                        type: string
                        description: 스탯 값
            symbol_stat_object:
              type: object
              description: 장착 심볼 정보
              properties:
                symbol:
                  type: array
                  description: 심볼 정보
                  items:
                    type: object
                    properties:
                      symbol_name:
                        type: string
                        description: 심볼 명
                      symbol_icon:
                        type: string
                        description: 심볼 아이콘
                      symbol_description:
                        type: string
                        description: 심볼 설명
                      symbol_other_effect_description:
                        type: string
                        description: 심볼 부가 효과 설명
                      symbol_force:
                        type: string
                        description: 심볼로 인한 증가 수치
                      symbol_level:
                        type: integer
                        format: int64
                        description: 심볼 레벨
                      symbol_str:
                        type: string
                        description: 심볼로 증가한 힘
                      symbol_dex:
                        type: string
                        description: 심볼로 증가한 민첩
                      symbol_int:
                        type: string
                        description: 심볼로 증가한 지력
                      symbol_luk:
                        type: string
                        description: 심볼로 증가한 운
                      symbol_hp:
                        type: string
                        description: 심볼로 증가한 체력
                      symbol_drop_rate:
                        type: string
                        description: 심볼로 증가한 아이템 드롭률
                      symbol_meso_rate:
                        type: string
                        description: 심볼로 증가한 메소 획득량
                      symbol_exp_rate:
                        type: string
                        description: 심볼로 증가한 경험치 획득량
                      symbol_growth_count:
                        type: integer
                        format: int64
                        description: 현재 보유 성장치
                      symbol_require_growth_count:
                        type: integer
                        format: int64
                        description: 성장 시 필요한 성장치
            other_stat_object:
              type: object
              description: 기타 능력치 영향 요소
              properties:
                other_stat:
                  type: array
                  description: 능력치에 영향을 주는 요소 및 스탯 정보
                  items:
                    type: object
                    properties:
                      other_stat_type:
                        type: string
                        description: 스탯 타입
                      stat_info:
                        type: array
                        description: 스탯 정보
                        items:
                          type: object
                          properties:
                            stat_name:
                              type: string
                              description: 스탯 명
                            stat_value:
                              type: string
                              description: 스탯 값
        hyper_stat_object:
          type: object
          description: 하이퍼 스탯 정보
          properties:
            hyper_stat:
              type: array
              description: 하이퍼 스탯 정보
              items:
                type: object
                properties:
                  stat_type:
                    type: string
                    description: 스탯 종류
                  stat_level:
                    type: integer
                    format: int64
                    description: 스탯 레벨
                  stat_increase:
                    type: string
                    description: 스탯 상승량
        propensity_object:
          type: object
          description: 성향 정보
          properties:
            charisma_level:
              type: integer
              format: int64
              description: 카리스마 레벨
            sensibility_level:
              type: integer
              format: int64
              description: 감성 레벨
            insight_level:
              type: integer
              format: int64
              description: 통찰력 레벨
            willingness_level:
              type: integer
              format: int64
              description: 의지 레벨
            handicraft_level:
              type: integer
              format: int64
              description: 손재주 레벨
            charm_level:
              type: integer
              format: int64
              description: 매력 레벨
        ability_object:
          type: object
          description: 어빌리티 정보
          properties:
            ability_info:
              type: array
              description: 어빌리티 정보
              items:
                type: object
                properties:
                  ability_no:
                    type: string
                    description: 어빌리티 번호
                  ability_grade:
                    type: string
                    description: 어빌리티 등급
                  ability_value:
                    type: string
                    description: 어빌리티 옵션 및 수치
        item_object:
          type: object
          description: 장착 장비(캐시 장비 제외) 정보
          properties:
            item_equipment_object:
              type: object
              description: 장착 장비 정보
              properties:
                item_equipment:
                  type: array
                  description: 장비 정보
                  items:
                    type: object
                    properties:
                      item_equipment_part:
                        type: string
                        description: 장비 부위 명
                      item_equipment_slot:
                        type: string
                        description: 장비 슬롯 위치
                      item_name:
                        type: string
                        description: 장비 명
                      item_icon:
                        type: string
                        description: 장비 아이콘
                      item_description:
                        type: string
                        description: 장비 설명
                      item_shape_name:
                        type: string
                        description: 장비 외형
                      item_shape_icon:
                        type: string
                        description: 장비 외형 아이콘
                      item_gender:
                        type: string
                        description: 전용 성별
                      item_total_option:
                        type: object
                        description: 장비 최종 옵션 정보
                        properties:
                          str:
                            type: string
                            description: STR
                          dex:
                            type: string
                            description: DEX
                          int:
                            type: string
                            description: INT
                          luk:
                            type: string
                            description: LUK
                          max_hp:
                            type: string
                            description: 최대 HP
                          max_mp:
                            type: string
                            description: 최대 MP
                          attack_power:
                            type: string
                            description: 공격력
                          magic_power:
                            type: string
                            description: 마력
                          armor:
                            type: string
                            description: 방어력
                          speed:
                            type: string
                            description: 이동속도
                          jump:
                            type: string
                            description: 점프력
                          boss_damage:
                            type: string
                            description: 보스 몬스터 데미지 증가 (%)
                          ignore_monster_armor:
                            type: string
                            description: 몬스터 방어율 무시(%)
                          all_stat:
                            type: string
                            description: 올스탯(%)
                          damage:
                            type: string
                            description: 데미지(%)
                          equipment_level_decrease:
                            type: integer
                            format: int64
                            description: 착용 레벨 감소
                          max_hp_rate:
                            type: string
                            description: 최대 HP(%)
                          max_mp_rate:
                            type: string
                            description: 최대 MP(%)
                      item_base_option:
                        type: object
                        description: 장비 기본 옵션 정보
                        properties:
                          str:
                            type: string
                            description: STR
                          dex:
                            type: string
                            description: DEX
                          int:
                            type: string
                            description: INT
                          luk:
                            type: string
                            description: LUK
                          max_hp:
                            type: string
                            description: 최대 HP
                          max_mp:
                            type: string
                            description: 최대 MP
                          attack_power:
                            type: string
                            description: 공격력
                          magic_power:
                            type: string
                            description: 마력
                          armor:
                            type: string
                            description: 방어력
                          speed:
                            type: string
                            description: 이동속도
                          jump:
                            type: string
                            description: 점프력
                          boss_damage:
                            type: string
                            description: 보스 몬스터 데미지 증가 (%)
                          ignore_monster_armor:
                            type: string
                            description: 몬스터 방어율 무시(%)
                          all_stat:
                            type: string
                            description: 올스탯(%)
                          max_hp_rate:
                            type: string
                            description: 최대 HP(%)
                          max_mp_rate:
                            type: string
                            description: 최대 MP(%)
                          base_equipment_level:
                            type: integer
                            format: int64
                            description: 기본 착용 레벨
                      potential_option_flag:
                        type: string
                        description: 잠재능력 봉인 여부 (true 봉인, false 봉인 없음)
                      additional_potential_option_flag:
                        type: string
                        description: 에디셔널 잠재능력 개방 여부 (true 봉인, false 봉인 없음)
                      potential_option_grade:
                        type: string
                        description: 잠재능력 등급
                      additional_potential_option_grade:
                        type: string
                        description: 에디셔널 잠재능력 등급
                      soul_potential_grade:
                        type: string
                        description: 소울 잠재능력 등급
                      soul_potential_amplified_grade:
                        type: integer
                        format: int64
                        description: 소울 증폭 단계
                      potential_option_1:
                        type: string
                        description: 잠재능력 첫 번째 옵션
                      potential_option_2:
                        type: string
                        description: 잠재능력 두 번째 옵션
                      potential_option_3:
                        type: string
                        description: 잠재능력 세 번째 옵션
                      additional_potential_option_1:
                        type: string
                        description: 에디셔널 잠재능력 첫 번째 옵션
                      additional_potential_option_2:
                        type: string
                        description: 에디셔널 잠재능력 두 번째 옵션
                      additional_potential_option_3:
                        type: string
                        description: 에디셔널 잠재능력 세 번째 옵션
                      soul_potential_option_1:
                        type: string
                        description: 소울 잠재능력 첫 번째 옵션
                      soul_potential_option_2:
                        type: string
                        description: 소울 잠재능력 두 번째 옵션
                      soul_potential_option_3:
                        type: string
                        description: 소울 잠재능력 세 번째 옵션
                      equipment_level_increase:
                        type: integer
                        format: int64
                        description: 착용 레벨 증가
                      item_exceptional_option:
                        type: object
                        description: 장비 특별 옵션 정보
                        properties:
                          str:
                            type: string
                            description: STR
                          dex:
                            type: string
                            description: DEX
