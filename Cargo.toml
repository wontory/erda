[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.8"
tauri-nspanel = "2.1"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSResponder",
  "NSView",
  "NSSound",
  "objc2-quartz-core",
] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSData",
  "NSArray",
  "NSDictionary",
  "NSString",
  "NSValue",
  "NSUUID",
  "NSObject",
] }
objc2-core-audio = { version = "0.3", default-features = false, features = [
  "std",
  "AudioHardware",
  "objc2",
  "objc2-foundation",
  "objc2-core-audio-types",
] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary"] }
libc = "0.2"
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
anyhow = "1"
