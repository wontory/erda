[package]
name = "erda"
version = "0.2.4"
edition = "2021"

[lib]
name = "erda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
flyout = { path = "../../../crates/flyout" }
nexon = { path = "../../../crates/nexon" }
chrono = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
flyout-macos = { path = "../../../crates/flyout-macos" }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-audio = { workspace = true }
objc2-core-audio-types = { workspace = true }
objc2-core-foundation = { workspace = true }
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
flyout-windows = { path = "../../../crates/flyout-windows" }
windows = { workspace = true }
